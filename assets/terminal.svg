<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1200" y2="520">
      <stop stop-color="#07070A"/>
      <stop offset="0.55" stop-color="#0B0714"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1200" y2="520">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="miniGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#8B5CF6"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#terminalBg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#miniGrid)"/>

  <!-- Glow -->
  <ellipse
    cx="200"
    cy="250"
    rx="220"
    ry="170"
    fill="#7C3AED"
    fill-opacity="0.08"
  />

  <ellipse
    cx="1030"
    cy="300"
    rx="230"
    ry="170"
    fill="#22D3EE"
    fill-opacity="0.06"
  />

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="518"
    rx="27"
    stroke="url(#borderGradient)"
    stroke-opacity="0.5"
    stroke-width="2"
  />

  <!-- Terminal header -->
  <rect
    x="34"
    y="30"
    width="1132"
    height="58"
    rx="16"
    fill="#FFFFFF"
    fill-opacity="0.025"
    stroke="#FFFFFF"
    stroke-opacity="0.06"
  />

  <circle cx="62" cy="59" r="6" fill="#FF5F57"/>
  <circle cx="83" cy="59" r="6" fill="#FEBB2E"/>
  <circle cx="104" cy="59" r="6" fill="#28C840"/>

  <text
    x="600"
    y="66"
    text-anchor="middle"
    fill="#94A3B8"
    font-family="Consolas, monospace"
    font-size="15"
    letter-spacing="2"
  >
    PRATYUSH // DEVELOPER COMMAND CENTER
  </text>

  <!-- Left command panel -->
  <text
    x="70"
    y="140"
    fill="#22D3EE"
    font-family="Consolas, monospace"
    font-size="17"
  >
    $ whoami
  </text>

  <text
    x="70"
    y="172"
    fill="#F8FAFC"
    font-family="Consolas, monospace"
    font-size="22"
    font-weight="700"
  >
    PRATYUSH
  </text>

  <text
    x="70"
    y="220"
    fill="#A78BFA"
    font-family="Consolas, monospace"
    font-size="17"
  >
    $ current_role
  </text>

  <text
    x="70"
    y="251"
    fill="#E2E8F0"
    font-family="Consolas, monospace"
    font-size="18"
  >
    Full-Stack Developer
  </text>

  <text
    x="70"
    y="298"
    fill="#A78BFA"
    font-family="Consolas, monospace"
    font-size="17"
  >
    $ current_focus
  </text>

  <text
    x="70"
    y="329"
    fill="#E2E8F0"
    font-family="Consolas, monospace"
    font-size="18"
  >
    AI/ML + Advanced Python
  </text>

  <text
    x="70"
    y="376"
    fill="#A78BFA"
    font-family="Consolas, monospace"
    font-size="17"
  >
    $ building
  </text>

  <text
    x="70"
    y="407"
    fill="#E2E8F0"
    font-family="Consolas, monospace"
    font-size="18"
  >
    Full-Stack + AI Projects
  </text>

  <!-- Right dashboard -->
  <rect
    x="625"
    y="122"
    width="505"
    height="316"
    rx="22"
    fill="#FFFFFF"
    fill-opacity="0.02"
    stroke="#FFFFFF"
    stroke-opacity="0.07"
  />

  <text
    x="670"
    y="167"
    fill="#8B5CF6"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="2"
  >
    LIVE DEVELOPER STATUS
  </text>

  <!-- Status rows -->
  <text x="670" y="215" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="15">
    LEARNING
  </text>
  <text x="845" y="215" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="16" font-weight="600">
    AI / ML
  </text>

  <text x="670" y="259" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="15">
    EXPLORING
  </text>
  <text x="845" y="259" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="16" font-weight="600">
    GenAI + LLMs
  </text>

  <text x="670" y="303" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="15">
    TARGET
  </text>
  <text x="845" y="303" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="16" font-weight="600">
    Software / AI Engineering
  </text>

  <text x="670" y="347" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="15">
    PORTFOLIO
  </text>
  <text x="845" y="347" fill="#22D3EE" font-family="Segoe UI, Arial" font-size="16" font-weight="600">
    pratyush.online
  </text>

  <!-- Active status -->
  <circle cx="681" cy="396" r="7" fill="#22D3EE">
    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="700"
    y="402"
    fill="#C4B5FD"
    font-family="Consolas, monospace"
    font-size="15"
  >
    STATUS: LEARNING • BUILDING • EVOLVING
  </text>

  <!-- Scan line -->
  <rect
    x="35"
    y="105"
    width="1130"
    height="2"
    fill="url(#scanGradient)"
    opacity="0.5"
  >
    <animate
      attributeName="y"
      values="105;475;105"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Bottom command -->
  <text
    x="70"
    y="475"
    fill="#22D3EE"
    font-family="Consolas, monospace"
    font-size="16"
  >
    $
  </text>

  <text
    x="90"
    y="475"
    fill="#94A3B8"
    font-family="Consolas, monospace"
    font-size="16"
  >
    building_the_future --one-commit-at-a-time
  </text>

  <rect x="510" y="460" width="10" height="20" fill="#8B5CF6">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

</svg>