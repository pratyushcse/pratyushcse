<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050507"/>
      <stop offset="0.5" stop-color="#0B0614"/>
      <stop offset="1" stop-color="#030711"/>
    </linearGradient>

    <linearGradient id="title" x1="260" y1="150" x2="930" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.35" stop-color="#A78BFA"/>
      <stop offset="0.7" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>

  <circle cx="240" cy="100" r="190" fill="url(#glow1)" filter="url(#softGlow)">
    <animate attributeName="cx" values="220;320;220" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="990" cy="300" r="210" fill="url(#glow2)" filter="url(#softGlow)">
    <animate attributeName="cy" values="280;210;280" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.32">
    <circle cx="160" cy="80" r="2.5" fill="#C4B5FD">
      <animate attributeName="cy" values="80;55;80" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="115" r="2.5" fill="#67E8F9">
      <animate attributeName="cy" values="115;85;115" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="930" cy="340" r="2" fill="#A78BFA">
      <animate attributeName="cy" values="340;315;340" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="310" cy="350" r="2" fill="#22D3EE">
      <animate attributeName="cy" values="350;320;350" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="65" y="48" width="210" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.035" stroke="#8B5CF6" stroke-opacity="0.45"/>
  <circle cx="88" cy="69" r="5" fill="#22D3EE">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="104" y="75" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    HELLO, I’M PRATYUSH
  </text>

  <text x="600" y="205" text-anchor="middle" fill="url(#title)"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="104"
        font-weight="800"
        letter-spacing="8"
        filter="url(#textGlow)">
    PRATYUSH
  </text>

  <text x="600" y="262" text-anchor="middle" fill="#C4B5FD"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="25"
        font-weight="600">
    Full-Stack Developer • AI/ML Enthusiast • Freelance Developer
  </text>

  <text x="600" y="306" text-anchor="middle" fill="#94A3B8"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19">
    Building intelligent software, scalable systems &amp; digital experiences
  </text>

  <g transform="translate(462 340)">
    <rect width="276" height="45" rx="22.5" fill="#FFFFFF" fill-opacity="0.035" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="138" y="29" text-anchor="middle" fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="14">
      &gt; learning • building • evolving
    </text>
  </g>

  <path d="M80 375 C300 330, 450 405, 660 360 C850 320, 980 385, 1120 350"
        stroke="url(#title)"
        stroke-opacity="0.22"
        stroke-width="1.5"
        fill="none">
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>