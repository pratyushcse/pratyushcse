<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050507"/>
      <stop offset=".55" stop-color="#0B0714"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>

    <linearGradient id="dashAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <pattern id="dashGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#8B5CF6"
        stroke-opacity=".045"
      />
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#dashBg)"/>
  <rect width="1200" height="430" rx="30" fill="url(#dashGrid)"/>

  <rect
    x="1"
    y="1"
    width="1198"
    height="428"
    rx="29"
    fill="none"
    stroke="url(#dashAccent)"
    stroke-opacity=".35"
  />

  <text
    x="55"
    y="55"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="3"
    fill="#22D3EE"
  >
    GITHUB // DEVELOPMENT SNAPSHOT
  </text>

  <text
    x="55"
    y="108"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="900"
  >
    <tspan fill="#F8FAFC">ENGINEERING </tspan>
    <tspan fill="url(#dashAccent)">DASHBOARD</tspan>
  </text>

  <g transform="translate(55 145)">
    <rect
      width="335"
      height="195"
      rx="20"
      fill="#FFFFFF"
      fill-opacity=".025"
      stroke="#FFFFFF"
      stroke-opacity=".08"
    />

    <text
      x="28"
      y="38"
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="12"
      font-weight="700"
      letter-spacing="2"
      fill="#8B5CF6"
    >
      PRIMARY FOCUS
    </text>

    <text
      x="28"
      y="82"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="800"
      fill="#F8FAFC"
    >
      Full-Stack
    </text>

    <text
      x="28"
      y="113"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#94A3B8"
    >
      Software Development
    </text>

    <rect x="28" y="145" width="260" height="7" rx="4" fill="#FFFFFF" fill-opacity=".06"/>

    <rect x="28" y="145" width="205" height="7" rx="4" fill="url(#dashAccent)">
      <animate
        attributeName="width"
        values="125;205;125"
        dur="3.5s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <g transform="translate(433 145)">
    <rect
      width="335"
      height="195"
      rx="20"
      fill="#FFFFFF"
      fill-opacity=".025"
      stroke="#FFFFFF"
      stroke-opacity=".08"
    />

    <text
      x="28"
      y="38"
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="12"
      font-weight="700"
      letter-spacing="2"
      fill="#22D3EE"
    >
      CURRENT LEARNING
    </text>

    <text
      x="28"
      y="82"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="800"
      fill="#F8FAFC"
    >
      AI / ML
    </text>

    <text
      x="28"
      y="113"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#94A3B8"
    >
      GenAI + LLMs
    </text>

    <circle cx="50" cy="157" r="7" fill="#22D3EE">
      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.2s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="70"
      y="163"
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="13"
      font-weight="700"
      fill="#C4B5FD"
    >
      ACTIVE LEARNING
    </text>
  </g>

  <g transform="translate(810 145)">
    <rect
      width="335"
      height="195"
      rx="20"
      fill="#FFFFFF"
      fill-opacity=".025"
      stroke="#FFFFFF"
      stroke-opacity=".08"
    />

    <text
      x="28"
      y="38"
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="12"
      font-weight="700"
      letter-spacing="2"
      fill="#A78BFA"
    >
      CAREER TARGET
    </text>

    <text
      x="28"
      y="82"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="800"
      fill="#F8FAFC"
    >
      Software Engineer
    </text>

    <text
      x="28"
      y="113"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      fill="#94A3B8"
    >
      AI • Full-Stack
    </text>

    <text
      x="28"
      y="160"
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="13"
      font-weight="700"
      fill="#22D3EE"
    >
      BUILD → LEARN → EVOLVE
    </text>
  </g>

  <text
    x="55"
    y="390"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    fill="#94A3B8"
  >
    Data shown here is intentionally profile-based, not fabricated GitHub metrics.
  </text>

  <rect
    x="30"
    y="132"
    width="1140"
    height="1"
    fill="#22D3EE"
    opacity=".12"
  >
    <animate
      attributeName="y"
      values="132;400;132"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>
</svg>