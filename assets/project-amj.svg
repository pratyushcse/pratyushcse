<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="310"
  viewBox="0 0 1200 310"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="amjBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07070A"/>
      <stop offset=".55" stop-color="#10091D"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>

    <linearGradient id="amjAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="amjGlow">
      <stop stop-color="#8B5CF6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="310" rx="28" fill="url(#amjBg)"/>

  <ellipse cx="1050" cy="145" rx="250" ry="220" fill="url(#amjGlow)">
    <animate
      attributeName="cx"
      values="1050;980;1050"
      dur="6s"
      repeatCount="indefinite"
    />
  </ellipse>

  <rect
    x="1"
    y="1"
    width="1198"
    height="308"
    rx="27"
    fill="none"
    stroke="url(#amjAccent)"
    stroke-opacity=".45"
  />

  <text
    x="60"
    y="62"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="3"
    fill="#22D3EE"
  >
    PROJECT // 001
  </text>

  <text
    x="60"
    y="122"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="900"
    letter-spacing=".5"
    fill="#F8FAFC"
  >
    AMJ ENTERPRISES
  </text>

  <text
    x="60"
    y="162"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#A78BFA"
  >
    LED Wall Rental &amp; Visual Solutions
  </text>

  <text
    x="60"
    y="205"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    fill="#94A3B8"
  >
    Professional business website for LED wall rental services and visual installations.
  </text>

  <text
    x="60"
    y="256"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    fill="#CBD5E1"
  >
    HTML • CSS • JAVASCRIPT • RESPONSIVE DESIGN
  </text>

  <rect
    x="922"
    y="111"
    width="210"
    height="54"
    rx="27"
    fill="#8B5CF6"
    fill-opacity=".10"
    stroke="#8B5CF6"
    stroke-opacity=".55"
  />

  <circle cx="952" cy="138" r="6" fill="#22D3EE">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.3s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="978"
    y="144"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing=".5"
    fill="#F8FAFC"
  >
    VIEW PROJECT →
  </text>
</svg>
