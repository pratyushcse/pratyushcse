  <defs>
    <linearGradient id="stackBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050507"/>
      <stop offset=".55" stop-color="#0C0715"/>
      <stop offset="1" stop-color="#041018"/>
