<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="330"
  viewBox="0 0 1200 330"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050507"/>
      <stop offset=".55" stop-color="#10091D"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>

    <linearGradient id="contactAccent">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="contactGlow">
      <stop stop-color="#8B5CF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="330" rx="30" fill="url(#contactBg)"/>

  <ellipse
    cx="600"
    cy="170"
    rx="390"
    ry="240"
    fill="url(#contactGlow)"
  >
    <animate
      attributeName="rx"
      values="330;430;330"
      dur="6s"
      repeatCount="indefinite"
    />
  </ellipse>

  <rect
    x="1"
    y="1"
    width="1198"
    height="328"
    rx="29"
    fill="none"
    stroke="url(#contactAccent)"
    stroke-opacity=".4"
  />

  <text
    x="600"
    y="72"
    text-anchor="middle"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="3"
    fill="#22D3EE"
  >
    CONNECTION // OPEN
  </text>

  <text
    x="600"
    y="140"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="900"
  >
    <tspan fill="#F8FAFC">LET'S BUILD </tspan>
    <tspan fill="url(#contactAccent)">SOMETHING EXCEPTIONAL</tspan>
  </text>

  <text
    x="600"
    y="187"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#94A3B8"
  >
    Software • AI • Full-Stack Development • Digital Experiences
  </text>

  <rect
    x="396"
    y="225"
    width="408"
    height="58"
    rx="29"
    fill="#8B5CF6"
    fill-opacity=".10"
    stroke="#22D3EE"
    stroke-opacity=".5"
  />

  <circle cx="430" cy="254" r="7" fill="#22D3EE">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.1s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="600"
    y="261"
    text-anchor="middle"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="15"
    font-weight="700"
    fill="#F8FAFC"
  >
    OPEN PORTFOLIO → PRATYUSH.ONLINE
  </text>
</svg>