<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="330"
  viewBox="0 0 1200 330"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="focusBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050507"/>
      <stop offset=".5" stop-color="#0B0614"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>

    <linearGradient id="focusAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#focusBg)"/>

  <rect
    x="1"
    y="1"
    width="1198"
    height="328"
    rx="27"
    fill="none"
    stroke="url(#focusAccent)"
    stroke-opacity=".32"
  />

  <text
    x="55"
    y="55"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="3"
    fill="#22D3EE"
  >
    DEVELOPER STATUS // LIVE
  </text>

  <text
    x="55"
    y="110"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="900"
  >
    <tspan fill="#F8FAFC">CURRENT </tspan>
    <tspan fill="url(#focusAccent)">FOCUS</tspan>
  </text>

  <circle cx="75" cy="160" r="6" fill="#22D3EE">
    <animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <text
    x="100"
    y="166"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="1"
    fill="#8B5CF6"
  >
    LEARNING
  </text>

  <text
    x="260"
    y="166"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#F8FAFC"
  >
    AI/ML + Advanced Python + Software Engineering
  </text>

  <circle cx="75" cy="214" r="6" fill="#8B5CF6">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <text
    x="100"
    y="220"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="1"
    fill="#8B5CF6"
  >
    BUILDING
  </text>

  <text
    x="260"
    y="220"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#F8FAFC"
  >
    Full-Stack Web Applications + AI Projects
  </text>

  <circle cx="75" cy="268" r="6" fill="#A78BFA">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text
    x="100"
    y="274"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="1"
    fill="#8B5CF6"
  >
    EXPLORING
  </text>

  <text
    x="260"
    y="274"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#F8FAFC"
  >
    Generative AI + LLMs + Intelligent Applications
  </text>

  <rect
    x="750"
    y="48"
    width="390"
    height="6"
    rx="3"
    fill="#FFFFFF"
    fill-opacity=".05"
  />

  <rect
    x="750"
    y="48"
    width="95"
    height="6"
    rx="3"
    fill="url(#focusAccent)"
  >
    <animate
      attributeName="x"
      values="750;1045;750"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>
</svg>