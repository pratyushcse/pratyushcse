<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="190"
  viewBox="0 0 1200 190"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="footerBg">
      <stop stop-color="#07070A"/>
      <stop offset=".5" stop-color="#0B0714"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>

    <linearGradient id="footerAccent">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect
    width="1200"
    height="190"
    rx="28"
    fill="url(#footerBg)"
  />

  <rect
    x="1"
    y="1"
    width="1198"
    height="188"
    rx="27"
    fill="none"
    stroke="url(#footerAccent)"
    stroke-opacity=".25"
  />

  <path
    d="M70 45H1130"
    stroke="url(#footerAccent)"
    stroke-opacity=".3"
  />

  <text
    x="600"
    y="95"
    text-anchor="middle"
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="17"
    font-weight="700"
    fill="#F8FAFC"
  >
    &lt; Designed &amp; Engineered by PRATYUSH /&gt;
  </text>

  <text
    x="600"
    
    y="130"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#94A3B8"
  >
    Learning continuously • Building deliberately • Evolving one commit at a time
  </text>

  <circle cx="600" cy="158" r="4.5" fill="#22D3EE">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.3s"
      repeatCount="indefinite"
    />
  </circle>
</svg>