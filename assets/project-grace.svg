<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="310"
  viewBox="0 0 1200 310"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="graceBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07070A"/>
      <stop offset=".55" stop-color="#07131B"/>
      <stop offset="1" stop-color="#10091D"/>
    </linearGradient>

    <linearGradient id="graceAccent">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="310" rx="28" fill="url(#graceBg)"/>

  <rect
    x="1"
    y="1"
    width="1198"
    height="308"
    rx="27"
    fill="none"
    stroke="url(#graceAccent)"
    stroke-opacity=".45"
