    PROJECT // 002
  </text>

  <text
    x="60"
    y="122"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="900"
    fill="#F8FAFC"
  >
    GRACE ENTERPRISES
  </text>

  <text
    x="60"
    y="162"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#A78BFA"
