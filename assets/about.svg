<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050507"/>
      <stop offset=".55" stop-color="#0B0714"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>

    <linearGradient id="aboutAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="aboutGlow">
      <stop stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="aboutGrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path
        d="M38 0H0V38"
        fill="none"
        stroke="#8B5CF6"
        stroke-opacity=".045"
      />
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#aboutBg)"/>
  <rect width="1200" height="430" rx="30" fill="url(#aboutGrid)"/>

  <ellipse cx="170" cy="180" rx="310" ry="250" fill="url(#aboutGlow)">
    <animate
      attributeName="cx"
      values="170;280;170"
      dur="8s"
      repeatCount="indefinite"
    />
  </ellipse>

  <rect
    x="1"
    y="1"
    width="1198"
    height="428"
    rx="29"
    fill="none"
    stroke="url(#aboutAccent)"
    stroke-opacity=".35"
  />

  <rect
    x="55"
    y="38"
    width="165"
    height="38"
    rx="19"
    fill="#8B5CF6"
    fill-opacity=".08"
    stroke="#8B5CF6"
    stroke-opacity=".35"
  />

  <circle cx="79" cy="57" r="5" fill="#22D3EE">
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
